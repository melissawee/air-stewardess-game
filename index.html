<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Aisle Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, playful, a little proud: a cabin crew shift as an arcade game
   IDEA: the boarding pass and the meal trolley are the game's housing
   PICTURE: first-person aisle with faces, seats, windows and request bubbles
   COLOUR and TYPE: deep teal cabin, orchid accent (Singapore's flower), cream cards; Sora
   LAYOUT: full-screen canvas, slim HUD on top, trolley tray at the bottom as the controller */
:root{--orchid:#a8326e;--orchid2:#d16a9f;--deep:#0f3446;--teal:#1f5d78;--cream:#f7f2e8;--gold:#e3b04b;--ink:#1d2730;--th:132px;color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:var(--deep);font-family:'Sora',system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#c{position:fixed;inset:0;display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#hud[hidden]{display:none}
.top{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:8px;align-items:stretch}
.panel{background:rgba(12,44,60,.86);color:#fff;border-radius:14px;padding:7px 12px;box-shadow:0 4px 14px rgba(0,0,0,.22);pointer-events:auto}
.lab{font-size:11px;opacity:.75;line-height:1.2}
#score{font-weight:800;font-size:20px;line-height:1.15;font-variant-numeric:tabular-nums}
#combo{font-size:12px;color:var(--gold);font-weight:600;min-height:15px}
.flight{flex:1;display:flex;flex-direction:column;justify-content:center;gap:4px}
.route{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.track{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.25);position:relative}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--orchid2)}
.track b{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px}
#eta{font-size:12px;opacity:.85;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.mood{width:min(190px,30vw)}
.mood .lab b{float:right;font-size:12px;opacity:1}
.bar{height:9px;border-radius:5px;background:rgba(255,255,255,.2);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;width:70%;border-radius:5px;background:#5cc98a;transition:width .25s,background .25s}
.icon-btn{width:44px;border:0;border-radius:14px;background:rgba(12,44,60,.86);color:#fff;font-weight:800;font-size:15px;pointer-events:auto}
#map{position:absolute;right:8px;top:86px;width:46px;border-radius:12px;background:rgba(12,44,60,.78);pointer-events:auto;cursor:pointer}
#banner{position:absolute;left:50%;top:84px;transform:translateX(-50%);max-width:min(560px,82vw);text-align:center;background:var(--orchid);color:#fff;font-weight:600;font-size:15px;padding:9px 16px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .25s;pointer-events:none}
#banner.on{opacity:1}
#banner.warn{background:#d7263d}
#hint{position:absolute;left:50%;bottom:calc(var(--th) + 14px);transform:translateX(-50%);width:max-content;max-width:min(520px,62vw);text-align:center;background:rgba(247,242,232,.96);color:var(--ink);font-size:14px;line-height:1.4;padding:8px 14px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.2);opacity:0;transition:opacity .3s;pointer-events:none}
#hint.on{opacity:1}
.side{position:absolute;bottom:calc(var(--th) + 10px);display:flex;flex-direction:column;gap:8px;pointer-events:auto}
#walk{left:10px}
#acts{right:10px;align-items:flex-end}
.walk-btn{width:58px;height:58px;border-radius:18px;border:0;background:rgba(12,44,60,.86);color:#fff;font-size:22px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.walk-btn:active{background:var(--orchid)}
.act{min-height:46px;padding:0 14px;border-radius:14px;border:0;background:#fff;color:var(--ink);font-weight:600;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.25);display:none;align-items:center;gap:8px;position:relative;overflow:hidden;white-space:nowrap}
.act.show{display:flex}
.act kbd{font:600 11px 'Sora',sans-serif;background:rgba(0,0,0,.08);border-radius:5px;padding:1px 5px}
.act.alert{background:#d7263d;color:#fff;animation:pulse .6s infinite alternate}
.act.alert kbd{background:rgba(255,255,255,.2)}
#bSmile{display:flex;background:#fff}
#bSmile .fill{position:absolute;left:0;bottom:0;height:4px;background:var(--orchid);width:0;transition:width .2s}
#bSmile.ready{background:var(--orchid);color:#fff;animation:pulse .7s infinite alternate}
#bSmile.ready kbd{background:rgba(255,255,255,.2)}
@keyframes pulse{to{transform:scale(1.05)}}
/* trolley */
#trolley{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(620px,100vw);height:var(--th);pointer-events:auto}
.cart{position:absolute;left:4%;right:4%;top:26px;bottom:0;border-radius:14px 14px 0 0;background:linear-gradient(180deg,#e9edf0 0,#c3cad0 30%,#aeb6bd 100%);box-shadow:0 -6px 24px rgba(0,0,0,.3),inset 0 2px 0 #fff}
.cart:before{content:"";position:absolute;left:10px;right:10px;bottom:10px;height:16px;border-radius:5px;background:repeating-linear-gradient(90deg,#9aa3ab 0 2px,transparent 2px 46px),linear-gradient(#b8c0c6,#a3acb3)}
#tray{position:absolute;left:5%;right:5%;top:34px;display:flex;justify-content:center;gap:6px;flex-wrap:nowrap}
.item{flex:0 1 66px;height:70px;border:0;border-radius:14px;background:#fff;box-shadow:0 3px 0 #8f989f,0 4px 10px rgba(0,0,0,.15);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;transition:transform .08s}
.item:active,.item.hit{transform:translateY(3px);box-shadow:0 0 0 #8f989f}
.item canvas{width:40px;height:40px}
.item .nm{font-size:10px;line-height:1.1;color:#3a4650;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.item .k{position:absolute;left:5px;top:3px;font-size:10px;font-weight:800;color:#8a949c}
.item .st{position:absolute;right:4px;top:3px;font-size:11px;font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums}
.item.low .st{color:#d7263d}
.item.empty{opacity:.45}
.item.want{box-shadow:0 3px 0 var(--orchid),0 0 0 3px var(--orchid2)}
.item.bad{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.handle{position:absolute;left:0;right:0;top:12px;height:12px;border-radius:7px;background:linear-gradient(#f4f6f8,#9aa3ab);box-shadow:0 2px 4px rgba(0,0,0,.3)}
.hand{position:absolute;top:-6px;width:74px;height:46px}
.hand.l{left:9%}.hand.r{right:9%;transform:scaleX(-1)}
#tray.locked{filter:grayscale(1) brightness(.9);pointer-events:none}
/* screens */
#scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(9,32,44,.55);overflow:auto}
#scr[hidden]{display:none}
.card{background:var(--cream);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(620px,100%);max-height:100%;overflow:auto}
.title{padding:clamp(22px,5vw,40px);text-align:left}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--orchid);font-size:15px}
.brand svg{width:34px;height:34px}
h1{font-size:clamp(36px,8vw,56px);line-height:1.02;margin:14px 0 10px;color:var(--deep);font-weight:800;text-wrap:balance}
h2{font-size:clamp(24px,5vw,32px);line-height:1.08;margin:0 0 6px;color:var(--deep);text-wrap:balance}
p{font-size:16px;line-height:1.55;margin:0 0 16px;max-width:60ch}
.cta{border:0;background:var(--orchid);color:#fff;font-weight:800;font-size:17px;padding:14px 26px;border-radius:14px;box-shadow:0 4px 0 #6f1c47;min-height:48px}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 #6f1c47}
.ghost{border:2px solid var(--deep);background:transparent;color:var(--deep);font-weight:600;font-size:15px;padding:11px 18px;border-radius:14px;min-height:48px}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.keys{margin-top:18px;font-size:13px;color:#56636d;line-height:1.7}
.keys kbd{font:600 12px 'Sora',sans-serif;background:#fff;border:1px solid #d6cfc2;border-bottom-width:2px;border-radius:6px;padding:0 6px}
.sel{padding:clamp(18px,4vw,30px)}
.passes{display:grid;gap:12px;margin:16px 0}
.pass{display:grid;grid-template-columns:minmax(0,1fr) 112px;border:0;padding:0;text-align:left;background:#fff;border-radius:16px;box-shadow:0 3px 10px rgba(0,0,0,.08);overflow:hidden;color:var(--ink)}
.pass:disabled{cursor:not-allowed;opacity:.55}
.pass .main{padding:12px 16px;border-right:2px dashed #e1d9cb}
.pass .hd{font-size:11px;color:var(--orchid);font-weight:600}
.pass .cities{display:flex;align-items:baseline;gap:10px;font-weight:800;font-size:26px;color:var(--deep);line-height:1.1;margin:2px 0}
.pass .cities small{font-size:12px;font-weight:400;color:#56636d}
.pass .meta{font-size:12px;color:#56636d}
.pass .stub{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;background:#fbf8f2}
.pass .stub b{font-size:13px;color:var(--deep)}
.stars{display:flex;gap:2px}
.stars svg{width:20px;height:20px}
.bp{overflow:hidden}
.bp .band{background:var(--orchid);color:#fff;padding:12px 22px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px}
.bp .body{padding:20px 22px}
.bp .big{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;margin-bottom:14px}
.bp .big div{font-size:clamp(34px,9vw,52px);font-weight:800;color:var(--deep);line-height:1}
.bp .big small{display:block;font-size:13px;font-weight:400;color:#56636d;margin-top:4px}
.bp .big .to{text-align:right}
.bp .big svg{width:40px;height:40px}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;border-top:2px dashed #e1d9cb;border-bottom:2px dashed #e1d9cb;padding:12px 0;margin-bottom:14px}
.fields span{display:block;font-size:11px;color:#56636d}
.fields b{font-size:14px;color:var(--deep)}
.bp ul{margin:6px 0 14px;padding-left:20px;font-size:15px;line-height:1.5}
.tip{background:#fff;border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.5;margin-bottom:18px;border-left:4px solid var(--gold)}
.report{padding:clamp(20px,4vw,32px);text-align:center}
.report .stars{justify-content:center;margin:6px 0 10px}
.report .stars svg{width:52px;height:52px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.stats div{background:#fff;border-radius:12px;padding:10px 6px}
.stats b{display:block;font-size:22px;color:var(--deep);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:#56636d}
.note{font-style:italic;color:#3a4650;margin:6px auto 18px;max-width:44ch}
.report .row-btns{justify-content:center}
.fine{font-size:12px;color:#7a858d;margin-top:14px}
@media(max-width:600px){
 :root{--th:122px}
 .top{gap:6px}.panel{padding:6px 9px}
 #score{font-size:17px}.mood{width:26vw}
 .route{font-size:12px;gap:5px}
 .item{height:64px}.item canvas{width:34px;height:34px}.item .nm{display:none}
 .walk-btn{width:52px;height:52px}
 .act{min-height:42px;padding:0 10px;font-size:13px}.act kbd{display:none}
 #hint{max-width:calc(100vw - 90px);font-size:13px;bottom:auto;top:134px}
 #banner{top:80px;font-size:14px}
 .fields{grid-template-columns:repeat(2,minmax(0,1fr))}
 .pass{grid-template-columns:minmax(0,1fr) 92px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

    <div class="cart"></div>
    <div id="tray"></div>
  </div>
</div>

<div id="scr"></div>

function tone(f,d,type,v,f2,delay){const a=ac();if(!a||muted)return;const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.1,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.03)}
function noise(d,v,freq){const a=ac();if(!a||muted)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=freq;const g=a.createGain();g.gain.value=v;s.connect(fl);fl.connect(g);g.connect(a.destination);s.start()}

function P(X,Y,z){const s=F/z;return[CX+X*s,CY-Y*s]}
function poly(pts,fill){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill()}

function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,Math.abs(w)/2,Math.abs(h)/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

const keys={up:false,dn:false};
function mkPax(row,seat,kind){
 const k=kind||(Math.random()<0.1?'kid':Math.random()<0.15?'elder':'adult');
 let style=pick(k==='kid'?[0,1,2]:[0,0,1,1,2,4]),hair=pick(HAIR);
 if(k==='elder'){hair=pick(['#9a9ea3','#c9c9c9','#e3e3e3']);style=pick([0,3,3,2])}
 return{row,seat,kind:k,skin:pick(SKIN),hair,style,scarf:pick(['#2e86ab','#a8326e','#5b8e7d','#f2c14e','#3d5a80','#c97b84']),shirt:pick(SHIRT),pants:pick(PANTS),glasses:k!=='kid'&&Math.random()<0.25,
  state:'idle',req:null,cool:R(1,7),moodT:0,belt:false,blink:R(0,5),cry:false,vip:false};
}
function buildCabin(L,demo){
 const rows=[];
 for(let i=1;i<=L.N;i++){const r=[];for(let s=0;s<4;s++)r.push(Math.random()<0.1?null:mkPax(i,s));rows[i]=r}
 const all=[];for(let i=1;i<=L.N;i++)rows[i].forEach(p=>p&&p.kind!=='kid'&&all.push(p));
 all.sort(()=>Math.random()-0.5);
 let b=L.babies||0;
 while(b-->0&&all.length){const p=all.pop();Object.assign(p,{kind:'baby',style:0,glasses:false,hair:'#3a2a1f'})}
 const sl=Math.round(all.length*(L.sleep||0));
 for(let i=0;i<sl&&all.length;i++)all.pop().state='sleep';
 if(demo){const pool=[];for(let i=1;i<=L.N;i++)rows[i].forEach(p=>p&&p.state==='idle'&&p.kind!=='baby'&&pool.push(p));pool.sort(()=>Math.random()-0.5).slice(0,6).forEach(p=>{p.state='req';p.req={items:[pick(['water','kopi','chicken','sling','juice'])],idx:0,t:R(6,20),T:20}})}
 return rows;
}

 G={L,lvl:i,demo:!!demo,theme:THEMES[L.theme],N:L.N,rows:buildCabin(L,demo),p:0,target:0,walk:0,anim:0,time:0,left:L.dur,
  score:0,combo:0,best:0,sat:75,smile:0,served:0,missed:0,stock,spawnT:1.5,babyT:R(8,14),freeze:0,restock:0,
  turb:{phase:'none',t:0,secured:false,idx:0,rum:0},shakeT:0,floaters:[],petals:[],hits:[],run:!demo,paused:false,ending:false,

const atGalley=()=>G.p===0&&G.target===0;

const label=(px)=>(G.L.row0+px.row-1)+SEATS[px.seat][2];

/* ---------- HUD messages ---------- */

/* ---------- actions ---------- */
function serve(item){
 if(!G||!G.run||G.paused)return;
 const btn=document.querySelector('.item[data-k="'+item+'"]');
 const flash=c=>{if(btn){btn.classList.remove(c);void btn.offsetWidth;btn.classList.add(c);setTimeout(()=>btn.classList.remove(c),300)}};
 if(G.turb.phase==='on'){hint('Service is paused during turbulence. Check seatbelts instead (B).');flash('bad');return}
 if(G.restock>0)return;
 const r=reachRow();
 if(!r){flash('bad');return}
 if(!(G.stock[item]>0)){hint('Out of '+ITEMS[item].toLowerCase()+'. Walk back to the galley and restock (R).');flash('bad');SFX.buzz();return}
 const ps=rowPax(r),want=ps.filter(p=>p.state==='req'&&!p.belt&&p.req.items[p.req.idx]===item);
 if(want.length){
  want.sort((a,b)=>a.req.t/a.req.T-b.req.t/b.req.T);const p=want[0],q=p.req;
  if(G.stock[item]!==Infinity)G.stock[item]--;
  flash('hit');
  if(q.idx<q.items.length-1){q.idx++;q.t=Math.min(q.T,q.t+q.T*0.35);G.score+=80;SFX.restock();floater(p,'Next course, please','#ffe7a3');return}
  const frac=q.t/q.T,mult=1+Math.min(G.combo,20)*0.1;
  const pts=Math.round(((p.vip?420:100)+50*frac)*mult);
  G.score+=pts;G.combo++;G.best=Math.max(G.best,G.combo);G.served++;
  G.sat=clamp(G.sat+(p.vip?6:p.cry?5:3),0,100);G.smile=Math.min(6,G.smile+1);
  p.state='happy';p.moodT=1.8;p.cool=R(5,10);p.req=null;p.cry=false;p.vip=false;
  floater(p,pick(G.L.greet.concat(['Thank you!']))+'  +'+pts,'#fff');SFX.ding();
  if(!G.tut.served){G.tut.served=true;if(G.lvl===0)setTimeout(()=>G&&G.run&&hint('Nice! Every good serve fills your smile meter. When it glows, press Warm smile (Space).',5),900)}
  return;
 }
 flash('bad');SFX.buzz();G.combo=0;
 const asked=ps.find(p=>p.state==='req'&&!p.belt);
 if(asked){asked.req.t=Math.max(0.5,asked.req.t-asked.req.T*0.15);G.sat=clamp(G.sat-2,0,100);floater(asked,pick(['Eh, wrong one leh','That’s not what I asked for']),'#ffd0d0')}
 else hint('Nobody in this row asked for '+ITEMS[item].toLowerCase()+'.',2.2);
 const sl=ps.find(p=>p.state==='sleep');
 if(sl){sl.state='angry';sl.moodT=4;sl.cool=6;G.sat=clamp(G.sat-5,0,100);floater(sl,'Hmph! I was sleeping…','#ffd0d0')}
}
function fixBelt(px){
 if(!px||!px.belt)return false;
 px.belt=false;G.score+=60;G.sat=clamp(G.sat+2,0,100);floater(px,pick(['Oops, thank you!','Sorry, sorry!','Buckled!']),'#d6f5e3');SFX.ding();return true;
}
function beltCheck(){
 if(!G||!G.run||G.paused)return;
 if(G.turb.phase!=='on'){hint('Seatbelt checks are for when the seatbelt sign is on.',2);return}
 const r=reachRow();if(!r)return;
 const p=rowPax(r).find(p=>p.belt);
 if(!fixBelt(p)){hint('Everyone in this row is buckled up. Look for the red belt bubbles.',2.2)}
}
function secure(){
 if(!G||!G.run||G.paused)return;
 if(G.turb.phase==='warn'&&!G.turb.secured){G.turb.secured=true;SFX.restock();banner('Trolley secured. Brace for turbulence.',false,2.5)}
}
function restock(){
 if(!G||!G.run||G.paused||G.restock>0)return;
 if(G.turb.phase==='on'){hint('Wait for the seatbelt sign to switch off.',2);return}
 if(!atGalley()){hint('Restocking happens at the galley. Walk all the way forward (▼).',2.6);return}
 G.restock=1.1;SFX.restock();
}
function warmSmile(){
 if(!G||!G.run||G.paused)return;
 if(G.smile<6){hint('Your smile meter fills with each happy passenger.',2);return}
 G.smile=0;G.freeze=4;G.sat=clamp(G.sat+4,0,100);

}

/* ---------- update ---------- */
function spawn(){
 const L=G.L,pool=[];let active=0;
 for(let i=1;i<=G.N;i++)rowPax(i).forEach(p=>{if(p.state==='req'||p.state==='bell')active++;else if(p.state==='idle'&&p.cool<=0&&p.kind!=='baby'&&!p.belt)pool.push(p)});
 if(active>=L.max||!pool.length)return;
 const p=pick(pool),base=R(L.pat[0],L.pat[1]);
 const plain=L.items.filter(k=>k!=='toy'&&k!=='lobster');
 if(L.vip&&Math.random()<L.vip&&p.kind==='adult'){
  const it=[pick(['bubbly','sling','water']),'satay'];if(Math.random()<0.65)it.push('lobster');
  p.vip=true;p.state='req';p.req={items:it,idx:0,t:base*1.7,T:base*1.7};

 else if(tb.phase==='warn'){tb.t-=dt;if(tb.t<=0){tb.phase='on';tb.t=8;tb.rum=0;

 // babies

 // passengers

 else if(a==='go')startLevel(LV);
 else if(a==='resume')pause(false);
 else if(a==='mute'){muted=!muted;b.textContent=muted?'Sound off':'Sound on'}
});
$('#tray').addEventListener('click',e=>{const b=e.target.closest('.item');if(b)serve(b.dataset.k)});
const hold=(id,k)=>{const el=$(id);const on=e=>{e.preventDefault();keys[k]=true;ac()},off=()=>keys[k]=false;el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointerleave',off);el.addEventListener('pointercancel',off)};
hold('#up','up');hold('#dn','dn');
$('#bSmile').onclick=warmSmile;$('#bSecure').onclick=secure;$('#bRestock').onclick=restock;$('#bBelt').onclick=beltCheck;$('#bPause').onclick=()=>pause(true);
mapc.addEventListener('click',e=>{if(!G||!G.run||G.paused||G.restock>0)return;const r=mapc.getBoundingClientRect(),y=e.clientY-r.top,h=mapc._hh,rh=mapc._rh;
 if(y>h-14){G.target=0;return}const row=Math.round((h-10-y)/rh-0.5);G.target=clamp(row-1,0,G.N-1)});
cv.addEventListener('click',e=>{if(!G||!G.run||G.paused)return;const x=e.clientX,y=e.clientY;
 for(let j=G.hits.length-1;j>=0;j--){const h=G.hits[j];if(x>=h.x0&&x<=h.x1&&y>=h.y0&&y<=h.y1){const p=h.px;
  if(p.row!==reachRow()){if(G.restock<=0)G.target=clamp(p.row-1,0,G.N-1);return}
  if(p.belt)fixBelt(p);
  else if(p.state==='sleep'){p.state='angry';p.moodT=4;p.cool=6;G.sat=clamp(G.sat-5,0,100);floater(p,'Hmph! I was sleeping…','#ffd0d0');SFX.buzz()}
  else if(p.state==='req')hint('Tap the matching item on your trolley to serve '+label(p)+'.',2.2);
  return}}});
addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 if(['arrowup','arrowdown',' ','arrowleft','arrowright'].includes(k)&&G&&G.run)e.preventDefault();
 if(!G||!G.run){if(k==='enter'&&!$('#scr').hidden){}return}
 if(k==='p'||k==='escape'){pause(!G.paused);return}
 if(G.paused)return;
 ac();
 if(k==='arrowup'||k==='w')keys.up=true;
 else if(k==='arrowdown'||k==='s')keys.dn=true;
 else if(k===' ')warmSmile();
 else if(k==='t')secure();
 else if(k==='b')beltCheck();
 else if(k==='r')restock();
 else if(k==='m'){muted=!muted}
 else if(/^[1-9]$/.test(k)){const it=G.L.items[+k-1];if(it)serve(it)}
});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowup'||k==='w')keys.up=false;if(k==='arrowdown'||k==='s')keys.dn=false});
addEventListener('blur',()=>{keys.up=keys.dn=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&G.run&&!G.paused)pause(true)});
addEventListener('resize',resize);

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
 if(G){if(G.demo){G.anim+=dt;G.p=2.2+Math.sin(now/5000)*2.2;G.target=G.p}else update(dt);render()}
 requestAnimationFrame(loop)}
resize();toMenu();requestAnimationFrame(loop);
window.__game={get G(){return G},startLevel,serve,endLevel};
}
</script>
</body>
