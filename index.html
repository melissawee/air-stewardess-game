<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Aisle Service</title>
<meta name="description" content="Live a day as a Singapore Flight stewardess: makeup, uniform, briefing, aisle service and hotel layovers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div class="top">
    <div class="panel"><div class="lab">Score</div><div id="score">0</div><div id="combo"></div></div>
    <div class="panel flight">
      <div class="route"><span id="rFrom">SIN</span><div class="track"><i id="trk"></i><b id="plane"><svg viewBox="0 0 24 24"><path fill="#fff" d="M21 15.5v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0v5l-8 5v2l8-2.5V18l-2 1.5V21l3.5-1 3.5 1v-1.5L13 18v-5z" transform="rotate(90 12 12)"/></svg></b></div><span id="rTo">KUL</span></div>
      <div id="eta">Landing in 1:00</div>
    </div>
    <div class="panel mood"><div class="lab">Cabin mood <b id="satv">75%</b></div><div class="bar"><i id="satb"></i></div></div>
    <button class="icon-btn" id="bPause" aria-label="Pause">II</button>
  </div>
  <canvas id="map" aria-label="Cabin map: tap a row to walk there"></canvas>
  <div id="banner"></div>
  <div id="hint"></div>
  <div class="side" id="walk">
    <button class="walk-btn" id="up" aria-label="Walk towards the back of the cabin">▲</button>
    <button class="walk-btn" id="dn" aria-label="Walk towards the galley">▼</button>
  </div>
  <div class="side" id="acts">
    <button class="act" id="bSecure">Secure trolley <kbd>T</kbd></button>
    <button class="act" id="bBelt">Check seatbelt <kbd>B</kbd></button>
    <button class="act" id="bRestock">Restock trolley <kbd>R</kbd></button>
    <button class="act" id="bSmile">Warm smile <kbd>Space</kbd><span class="fill"></span></button>
  </div>
  <div id="trolley">
    <div class="handle"></div>
    <svg class="hand l" viewBox="0 0 74 46" aria-hidden="true"><defs><pattern id="bt" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#a8326e"/><circle cx="5" cy="5" r="2.2" fill="#e3b04b"/><path d="M0 0l3 3M10 10l-3-3" stroke="#f3c6dc" stroke-width="1"/></pattern></defs><path d="M0 4h30l6 30H0z" fill="url(#bt)"/><path d="M30 10c8-4 22-4 30 2 6 5 6 14 0 18-10 6-24 5-30-2z" fill="#eec09a"/><path d="M40 22c4 2 9 2 14 0M38 16c5 2 12 2 18 0" stroke="#c99470" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <svg class="hand r" viewBox="0 0 74 46" aria-hidden="true"><path d="M0 4h30l6 30H0z" fill="url(#bt)"/><path d="M30 10c8-4 22-4 30 2 6 5 6 14 0 18-10 6-24 5-30-2z" fill="#eec09a"/><path d="M40 22c4 2 9 2 14 0M38 16c5 2 12 2 18 0" stroke="#c99470" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <div class="cart"></div>
    <div id="tray"></div>
  </div>
</div>

<div id="scr"></div>

<div id="life" aria-live="polite"></div>


<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/flight.js"></script>
<script src="js/life.js"></script>
</body>
</html>
